<text x="50" y="104" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="12" font-weight="500" fill="#ff1f2d" text-anchor="start" letter-spacing="3">// CAPABILITIES</text><text x="50" y="152" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#f4f4f5" text-anchor="start" >WHAT I <tspan font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-style="italic" font-weight="400" fill="#ff1f2d">build</tspan></text><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.40s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="0.40s" dur="0.6s" fill="freeze"/><line x1="50" y1="180" x2="470" y2="180" stroke="#fff" stroke-opacity=".12"/><text x="50" y="200" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="12" font-weight="600" fill="#ff1f2d" text-anchor="start" >01</text><text x="86" y="195" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#f4f4f5" text-anchor="start" letter-spacing="1">FULL STACK (MERN)</text><text x="86" y="212" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="start" >React, Node, Express, MongoDB, REST APIs</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="0.65s" dur="0.6s" fill="freeze"/><line x1="50" y1="224" x2="470" y2="224" stroke="#fff" stroke-opacity=".12"/><text x="50" y="244" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="12" font-weight="600" fill="#ff1f2d" text-anchor="start" >02</text><text x="86" y="239" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#f4f4f5" text-anchor="start" letter-spacing="1">UI/UX AND PROTOTYPING</text><text x="86" y="256" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="start" >Figma to pixel-accurate React and Tailwind</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.90s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="0.90s" dur="0.6s" fill="freeze"/><line x1="50" y1="268" x2="470" y2="268" stroke="#fff" stroke-opacity=".12"/><text x="50" y="288" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="12" font-weight="600" fill="#ff1f2d" text-anchor="start" >03</text><text x="86" y="283" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#f4f4f5" text-anchor="start" letter-spacing="1">GENERATIVE AI FEATURES</text><text x="86" y="300" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="start" >Google AI Studio and Gen AI API integration</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.15s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="1.15s" dur="0.6s" fill="freeze"/><line x1="50" y1="312" x2="470" y2="312" stroke="#fff" stroke-opacity=".12"/><text x="50" y="332" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="12" font-weight="600" fill="#ff1f2d" text-anchor="start" >04</text><text x="86" y="327" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#f4f4f5" text-anchor="start" letter-spacing="1">REAL-TIME AND PAYMENTS</text><text x="86" y="344" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="start" >Socket.io, JWT auth, Razorpay checkout</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.40s" dur="0.6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="1.40s" dur="0.6s" fill="freeze"/><line x1="50" y1="356" x2="470" y2="356" stroke="#fff" stroke-opacity=".12"/><text x="50" y="376" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="12" font-weight="600" fill="#ff1f2d" text-anchor="start" >05</text><text x="86" y="371" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#f4f4f5" text-anchor="start" letter-spacing="1">CREATIVE 3D WEB</text><text x="86" y="388" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9a9aa3" text-anchor="start" >Three.js, GSAP and Framer Motion</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.30s" dur="0.8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 0" to="0 0" begin="0.30s" dur="0.8s" fill="freeze"/><rect x="510" y="90" width="340" height="300" rx="18" fill="#0c0c10" fill-opacity=".85" stroke="#ff1f2d" stroke-opacity=".6"/><rect x="510" y="90" width="340" height="3" fill="url(#redline)"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></rect><g opacity="1"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0.0000;0.3133;0.3333;0.9800;1.0000" dur="12s" repeatCount="indefinite"/><text x="540" y="134" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="600" fill="#ff1f2d" text-anchor="start" letter-spacing="3">FOCUS 01 / 03</text><text x="540" y="186" font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-size="26" font-weight="400" fill="#f4f4f5" text-anchor="start" font-style="italic">BUILDING WITH AI</text><text x="540" y="226" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#9a9aa3" text-anchor="start" >Google AI Studio and Generative AI</text><text x="540" y="252" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#9a9aa3" text-anchor="start" >APIs inside real MERN products.</text><text x="540" y="278" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#9a9aa3" text-anchor="start" >AI Chat App with live messaging, plus</text><text x="540" y="304" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#9a9aa3" text-anchor="start" >a Job Portal matching roles to skills.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3133;0.3333;0.6467;0.6667;1.0000" dur="12s" repeatCount="indefinite"/><text x="540" y="134" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="600" fill="#ff1f2d" text-anchor="start" letter-spacing="3">FOCUS 02 / 03</text><text x="540" y="186" font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-size="26" font-weight="400" fill="#f4f4f5" text-anchor="start" font-style="italic">CREATIVE 3D WEB</text><text x="540" y="226" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#9a9aa3" text-anchor="start" >Three.js models, particle systems</text><text x="540" y="252" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#9a9aa3" text-anchor="start" >and scroll-triggered GSAP motion.</text><text x="540" y="278" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#9a9aa3" text-anchor="start" >An immersive 3D portfolio with</text><text x="540" y="304" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#9a9aa3" text-anchor="start" >high-performance WebGL rendering.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6467;0.6667;0.9800;1.0000" dur="12s" repeatCount="indefinite"/><text x="540" y="134" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="600" fill="#ff1f2d" text-anchor="start" letter-spacing="3">FOCUS 03 / 03</text><text x="540" y="186" font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-size="26" font-weight="400" fill="#f4f4f5" text-anchor="start" font-style="italic">PRODUCT UI/UX</text><text x="540" y="226" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#9a9aa3" text-anchor="start" >Figma prototypes turned into</text><text x="540" y="252" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#9a9aa3" text-anchor="start" >pixel-accurate React interfaces.</text><text x="540" y="278" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#9a9aa3" text-anchor="start" >Mobile-first layouts, dashboards</text><text x="540" y="304" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#9a9aa3" text-anchor="start" >and dark/light mode done right.</text></g><circle cx="540" cy="362" r="4" fill="#ff1f2d" opacity=".25"><animate attributeName="opacity" values="1;1;1" dur="12s" repeatCount="indefinite"/></circle><circle cx="558" cy="362" r="4" fill="#ff1f2d" opacity=".25"><animate attributeName="opacity" value