ter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a9aa3"><tspan fill="#ff1f2d">▸ </tspan>Designed responsive UIs in Figma, React.js and Tailwind CSS with</text><text x="96" y="314" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a9aa3">&#160;&#160;&#160;pixel-perfect accuracy across devices.</text><text x="96" y="334" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a9aa3"><tspan fill="#ff1f2d">▸ </tspan>Collaborated on production-grade REST API development and UI/UX</text><text x="96" y="354" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a9aa3">&#160;&#160;&#160;prototyping in an agile team.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.00s" dur="0.7s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="1.00s" dur="0.7s" fill="freeze"/><circle cx="62" cy="404" r="7" fill="#050507" stroke="#ff1f2d" stroke-width="2"/><circle cx="62" cy="404" r="3" fill="#ff1f2d"/><text x="96" y="408" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f4f4f5" text-anchor="start" >Digi{Coders} Technologies Pvt. Ltd. — Lucknow</text><text x="850" y="408" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="12" font-weight="600" fill="#ff1f2d" text-anchor="end" letter-spacing="1">Jan 2024 – Dec 2024</text><text x="96" y="432" font-family="'Playfair Display',Georgia,'Times New Roman',serif" font-size="14" font-weight="400" fill="#9a9aa3" text-anchor="start" font-style="italic">Frontend Developer</text><text x="96" y="462" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a9aa3"><tspan fill="#ff1f2d">▸ </tspan>Built and delivered multiple client-facing web projects using React.js,</text><text x="96" y="482" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a9aa3">&#160;&#160;&#160;HTML5, CSS3 and JavaScript, consistently meeting deadlines.</text><text x="96" y="502" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a9aa3"><tspan fill="#ff1f2d">▸ </tspan>Improved UI performance and cross-browser compatibility; contributed</text><text x="96" y="522" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a9aa3">&#160;&#160;&#160;to new feature rollouts with measurable UX improvement.</text><text x="96" y="542" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a9aa3"><tspan fill="#ff1f2d">▸ </tspan>Hands-on with agile workflows, testing, debugging and code review.</text></g><line x1="62" y1="206" x2="62" y2="536" stroke="#ff1f2d" stroke-opacity=".5"/><circle r="4" fill="#ff4f9a" filter="url(#tglow)"><animateMotion dur="5s" repeatCount="indefinite" path="M62 206 L62 536"/></circle><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.80s" dur="0.8s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="1.80s" dur="0.8s" fill="freeze"/><text x="50" y="596" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="600" fill="#ff1f2d" text-anchor="start" letter-spacing="2">// EDUCATION</text><text x="490" y="596" font-family="'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Courier New',monospace" font-size="11" font-weight="600" fill="#ff1f2d" text-anchor="start" letter-spacing="2">// CERTIFICATIONS</text><line x1="50" y1="606" x2="450" y2="606" stroke="#fff" stroke-opacity=".15"/><line x1="490" y1="606" x2="850" y2="606" stroke="#fff" stroke-opacity=".15"/><text x="50" y="632" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sa